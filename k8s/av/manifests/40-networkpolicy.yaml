apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: av-scanner-egress
  namespace: av-scanning
spec:
  podSelector:
    matchLabels:
      app: av-scanner
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # ClamAV signature updates (freshclam needs internet/mirror access)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
